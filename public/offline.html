<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Offline — Up17 AutoPublisher</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        color-scheme: light dark;
        background: Canvas;
        color: CanvasText;
      }
      main {
        max-width: 420px;
        padding: 32px;
        text-align: center;
      }
      img {
        width: 64px;
        height: 64px;
      }
      h1 {
        font-size: 28px;
        letter-spacing: -0.03em;
      }
      p {
        line-height: 1.6;
        opacity: 0.8;
      }
      a {
        display: inline-block;
        margin-top: 12px;
        padding: 12px 22px;
        border-radius: 999px;
        background: #6246c7;
        color: white;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon.svg" alt="" />
      <p>Up17 AutoPublisher</p>
      <h1>You’re offline</h1>
      <p>
        The cached public shell is available, but your workspace needs a connection. Nothing has
        been uploaded, scheduled or published.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
